<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 مغامرة حرف النون - لعبة تعليمية</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Comic Sans MS', 'Tahoma', sans-serif; }
  
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #43cea2, #185a9d, #f7971e, #ffd200);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    overflow-x: hidden;
    padding: 10px;
  }
  
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  
  .container {
    max-width: 1100px;
    margin: 0 auto;
    background: rgba(255,255,255,0.95);
    border-radius: 30px;
    padding: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    border: 5px solid #ffd200;
    position: relative;
  }
  
  h1 {
    text-align: center;
    font-size: 2.8em;
    color: #185a9d;
    text-shadow: 3px 3px 0 #ffd200, 6px 6px 15px rgba(0,0,0,0.2);
    margin-bottom: 10px;
    animation: bounce 2s infinite;
  }
  
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  
  .subtitle {
    text-align: center;
    font-size: 1.3em;
    color: #2e7d32;
    margin-bottom: 20px;
    font-weight: bold;
  }
  
  .screen { display: none; animation: fadeIn 0.5s; }
  .screen.active { display: block; }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  /* شاشة البداية */
  .start-box {
    text-align: center;
    padding: 30px;
  }
  
  .big-letter {
    font-size: 10em;
    color: #e53935;
    text-shadow: 5px 5px 0 #ffd200, 10px 10px 20px rgba(0,0,0,0.3);
    animation: pulse 1.5s infinite;
    display: inline-block;
  }
  
  @keyframes pulse {
    0%, 100% { transform: scale(1) rotate(-5deg); }
    50% { transform: scale(1.1) rotate(5deg); }
  }
  
  .players-setup {
    background: linear-gradient(135deg, #fff9c4, #c8e6c9);
    border-radius: 20px;
    padding: 25px;
    margin: 20px auto;
    max-width: 600px;
    border: 3px dashed #185a9d;
  }
  
  .players-setup label {
    font-size: 1.3em;
    color: #185a9d;
    font-weight: bold;
    display: block;
    margin-bottom: 10px;
  }
  
  .players-setup input {
    width: 100%;
    padding: 12px;
    font-size: 1.2em;
    border: 3px solid #43cea2;
    border-radius: 15px;
    margin-bottom: 10px;
    text-align: center;
    outline: none;
  }
  
  .players-setup input:focus {
    border-color: #f7971e;
    box-shadow: 0 0 15px rgba(247,151,30,0.5);
  }
  
  .btn {
    background: linear-gradient(135deg, #f7971e, #ffd200);
    color: #185a9d;
    border: none;
    padding: 15px 40px;
    font-size: 1.5em;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    transition: all 0.3s;
    margin: 10px;
  }
  
  .btn:hover {
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 12px 25px rgba(0,0,0,0.3);
  }
  
  .btn:active { transform: translateY(0); }
  
  .btn-green { background: linear-gradient(135deg, #43cea2, #185a9d); color: white; }
  .btn-red { background: linear-gradient(135deg, #ff6b6b, #e53935); color: white; }
  .btn-blue { background: linear-gradient(135deg, #185a9d, #43cea2); color: white; }
  
  /* لوحة النقاط */
  .scoreboard {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    background: linear-gradient(135deg, #185a9d, #43cea2);
    padding: 15px;
    border-radius: 20px;
    margin-bottom: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  
  .player-card {
    background: white;
    padding: 10px 20px;
    border-radius: 15px;
    margin: 5px;
    text-align: center;
    min-width: 130px;
    border: 3px solid transparent;
    transition: all 0.3s;
  }
  
  .player-card.active {
    border-color: #ffd200;
    transform: scale(1.1);
    box-shadow: 0 0 20px #ffd200;
    animation: glow 1s infinite alternate;
  }
  
  @keyframes glow {
    from { box-shadow: 0 0 10px #ffd200; }
    to { box-shadow: 0 0 25px #ffd200, 0 0 35px #f7971e; }
  }
  
  .player-name {
    font-size: 1.2em;
    color: #185a9d;
    font-weight: bold;
  }
  
  .player-score {
    font-size: 2em;
    color: #e53935;
    font-weight: bold;
  }
  
  /* معلومات الجولة */
  .round-info {
    background: linear-gradient(135deg, #ffd200, #f7971e);
    padding: 15px;
    border-radius: 15px;
    text-align: center;
    margin-bottom: 20px;
    border: 3px solid #185a9d;
  }
  
  .round-title {
    font-size: 1.8em;
    color: #185a9d;
    font-weight: bold;
  }
  
  .round-desc {
    font-size: 1.1em;
    color: #2e7d32;
    margin-top: 5px;
  }
  
  /* جولة 1: التقاط الن */
  .card-display {
    text-align: center;
    padding: 30px;
  }
  
  .big-card {
    background: white;
    border-radius: 25px;
    padding: 40px;
    margin: 20px auto;
    max-width: 400px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    border: 5px solid #43cea2;
    animation: cardAppear 0.5s;
  }
  
  @keyframes cardAppear {
    from { transform: scale(0) rotate(-180deg); }
    to { transform: scale(1) rotate(0); }
  }
  
  .card-emoji {
    font-size: 8em;
    display: block;
    margin-bottom: 10px;
  }
  
  .card-word {
    font-size: 3em;
    color: #185a9d;
    font-weight: bold;
  }
  
  .answer-buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  
  /* جولة 2: سباق الن */
  .race-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    padding: 20px;
  }
  
  .race-item {
    background: white;
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    border: 4px solid #43cea2;
    transition: all 0.3s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }
  
  .race-item:hover {
    transform: translateY(-5px) scale(1.05);
    border-color: #ffd200;
  }
  
  .race-item.correct {
    background: #c8e6c9;
    border-color: #2e7d32;
    animation: correctAnim 0.5s;
  }
  
  .race-item.wrong {
    background: #ffcdd2;
    border-color: #c62828;
    animation: shake 0.5s;
  }
  
  .race-item.disabled {
    opacity: 0.5;
    pointer-events: none;
  }
  
  @keyframes correctAnim {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }
  
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }
  
  .race-emoji { font-size: 4em; display: block; }
  .race-word { font-size: 1.5em; color: #185a9d; font-weight: bold; margin-top: 5px; }
  
  /* جولة 3: نقطة النجم */
  .star-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 15px;
    padding: 20px;
  }
  
  .star-item {
    background: linear-gradient(135deg, #fff9c4, #fff);
    border-radius: 20px;
    padding: 15px;
    text-align: center;
    cursor: pointer;
    border: 4px solid #ffd200;
    transition: all 0.3s;
  }
  
  .star-item:hover { transform: scale(1.08); }
  
  .star-item.selected {
    background: linear-gradient(135deg, #43cea2, #185a9d);
    color: white;
    border-color: #2e7d32;
  }
  
  .star-item.wrong-selected {
    background: #ffcdd2;
    border-color: #c62828;
  }
  
  .star-emoji { font-size: 3.5em; display: block; }
  .star-word { font-size: 1.2em; color: #185a9d; font-weight: bold; margin-top: 5px; }
  .star-item.selected .star-word { color: white; }
  
  /* جولة 4: المطابقة */
  .match-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    padding: 20px;
  }
  
  .match-column {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  
  .match-item {
    background: white;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    cursor: pointer;
    border: 4px solid #43cea2;
    transition: all 0.3s;
    font-size: 1.3em;
  }
  
  .match-item:hover { transform: scale(1.05); }
  
  .match-item.selected {
    background: #fff9c4;
    border-color: #f7971e;
    box-shadow: 0 0 15px #ffd200;
  }
  
  .match-item.matched {
    background: #c8e6c9;
    border-color: #2e7d32;
    opacity: 0.6;
    pointer-events: none;
  }
  
  .match-emoji { font-size: 2.5em; display: block; }
  
  /* جولة 5: القفز إلى الن */
  .jump-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    padding: 20px;
  }
  
  .jump-tile {
    aspect-ratio: 1;
    background: linear-gradient(135deg, #43cea2, #185a9d);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 2em;
    font-weight: bold;
    color: white;
    border: 4px solid #ffd200;
    transition: all 0.3s;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
  }
  
  .jump-tile:hover {
    transform: translateY(-8px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
  }
  
  .jump-tile.correct-jump {
    background: linear-gradient(135deg, #ffd200, #f7971e);
    animation: jumpAnim 0.6s;
  }
  
  .jump-tile.wrong-jump {
    background: #c62828;
    animation: shake 0.5s;
  }
  
  @keyframes jumpAnim {
    0% { transform: translateY(0); }
    50% { transform: translateY(-30px) scale(1.1); }
    100% { transform: translateY(0); }
  }
  
  /* جولة 6: النهائي */
  .final-area {
    text-align: center;
    padding: 20px;
  }
  
  .timer-display {
    font-size: 4em;
    color: #e53935;
    font-weight: bold;
    background: white;
    display: inline-block;
    padding: 10px 30px;
    border-radius: 20px;
    border: 5px solid #ffd200;
    margin-bottom: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  
  .final-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 15px;
    padding: 10px;
  }
  
  .final-item {
    background: white;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    cursor: pointer;
    border: 4px solid #43cea2;
    transition: all 0.3s;
  }
  
  .final-item:hover { transform: scale(1.1); }
  
  .final-item.collected {
    background: #c8e6c9;
    border-color: #2e7d32;
    opacity: 0.5;
    pointer-events: none;
  }
  
  .final-item.wrong-collect {
    background: #ffcdd2;
    border-color: #c62828;
    animation: shake 0.5s;
  }
  
  .final-emoji { font-size: 3em; display: block; }
  .final-word { font-size: 1em; color: #185a9d; font-weight: bold; }
  
  /* شاشة النهاية */
  .winner-box {
    text-align: center;
    padding: 30px;
    background: linear-gradient(135deg, #ffd200, #f7971e);
    border-radius: 25px;
    margin: 20px 0;
    border: 5px solid #185a9d;
  }
  
  .trophy {
    font-size: 8em;
    animation: trophySpin 2s infinite;
    display: inline-block;
  }
  
  @keyframes trophySpin {
    0%, 100% { transform: rotate(-10deg) scale(1); }
    50% { transform: rotate(10deg) scale(1.1); }
  }
  
  .winner-name {
    font-size: 3em;
    color: #185a9d;
    font-weight: bold;
    margin: 15px 0;
    text-shadow: 2px 2px 0 white;
  }
  
  .final-scores {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
    margin-top: 20px;
  }
  
  .final-score-card {
    background: white;
    padding: 15px 25px;
    border-radius: 15px;
    border: 3px solid #185a9d;
    min-width: 150px;
  }
  
  .feedback {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 5em;
    z-index: 1000;
    pointer-events: none;
    animation: feedbackAnim 1s forwards;
  }
  
  @keyframes feedbackAnim {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    30% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
    100% { opacity: 0; transform: translate(-50%, -150%) scale(1); }
  }
  
  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    pointer-events: none;
    z-index: 999;
    animation: confettiFall 3s linear forwards;
  }
  
  @keyframes confettiFall {
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
  
  .round-nav {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
    flex-wrap: wrap;
  }
  
  .round-dot {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #666;
    border: 3px solid #999;
  }
  
  .round-dot.done {
    background: #43cea2;
    color: white;
    border-color: #2e7d32;
  }
  
  .round-dot.current {
    background: #ffd200;
    color: #185a9d;
    border-color: #f7971e;
    animation: pulse 1s infinite;
  }
  
  .turn-indicator {
    background: linear-gradient(135deg, #e53935, #ff6b6b);
    color: white;
    padding: 15px;
    border-radius: 15px;
    text-align: center;
    font-size: 1.5em;
    font-weight: bold;
    margin-bottom: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  
  .progress-bar {
    background: #e0e0e0;
    height: 15px;
    border-radius: 10px;
    overflow: hidden;
    margin: 10px 0;
  }
  
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #43cea2, #ffd200);
    transition: width 0.3s;
    border-radius: 10px;
  }
  
  @media (max-width: 600px) {
    h1 { font-size: 2em; }
    .big-letter { font-size: 6em; }
    .card-emoji { font-size: 5em; }
    .card-word { font-size: 2em; }
    .jump-grid { grid-template-columns: repeat(3, 1fr); }
    .match-area { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>🌟 مغامرة حرف النون 🌟</h1>
  <div class="subtitle">✨ لعبة تعليمية ممتعة للأطفال ✨</div>

  <!-- شاشة البداية -->
  <div id="start-screen" class="screen active">
    <div class="start-box">
      <div class="big-letter">ن</div>
      <p style="font-size:1.3em; color:#185a9d; margin:20px 0;">
        🎉 هيا نتعلم حرف النون معاً! 🎉<br>
        🐜 نملة • 🐯 نمر • ⭐ نجم • 🌊 نهر 🌴
      </p>
      
      <div class="players-setup">
        <label>👦 اسم اللاعب الأول:</label>
        <input type="text" id="p1-name" placeholder="مثال: أحمد" value="أحمد">
        
        <label>👧 اسم اللاعب الثاني:</label>
        <input type="text" id="p2-name" placeholder="مثال: ليلى" value="ليلى">
        
        <label>🧒 اسم اللاعب الثالث (اختياري):</label>
        <input type="text" id="p3-name" placeholder="اتركه فارغاً إذا لم يلعب">
        
        <label>👶 اسم اللاعب الرابع (اختياري):</label>
        <input type="text" id="p4-name" placeholder="اتركه فارغاً إذا لم يلعب">
      </div>
      
      <button class="btn btn-green" onclick="startGame()">🚀 ابدأ المغامرة!</button>
    </div>
  </div>

  <!-- شاشة اللعبة -->
  <div id="game-screen" class="screen">
    <div class="scoreboard" id="scoreboard"></div>
    
    <div class="round-nav" id="round-nav"></div>
    
    <div class="turn-indicator" id="turn-indicator"></div>
    
    <div class="round-info">
      <div class="round-title" id="round-title"></div>
      <div class="round-desc" id="round-desc"></div>
    </div>
    
    <div id="round-content"></div>
    
    <div style="text-align:center; margin-top:20px;">
      <button class="btn btn-blue" id="next-btn" onclick="nextTurn()" style="display:none;">
        ➡️ اللاعب التالي
      </button>
    </div>
  </div>

  <!-- شاشة النهاية -->
  <div id="end-screen" class="screen">
    <div class="winner-box">
      <div class="trophy">🏆</div>
      <div class="winner-name" id="winner-name"></div>
      <div style="font-size:1.5em; color:#185a9d;" id="winner-title"></div>
      
      <div class="final-scores" id="final-scores"></div>
      
      <button class="btn btn-green" onclick="location.reload()" style="margin-top:25px;">
        🔄 العب مرة أخرى
      </button>
    </div>
  </div>
</div>

<script>
// ============ نظام الأصوات ============
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, duration, type='sine', volume=0.3) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playCorrect() {
  playTone(523.25, 0.15, 'sine', 0.3); // C
  setTimeout(() => playTone(659.25, 0.15, 'sine', 0.3), 100); // E
  setTimeout(() => playTone(783.99, 0.3, 'sine', 0.3), 200); // G
}

function playWrong() {
  playTone(200, 0.2, 'sawtooth', 0.2);
  setTimeout(() => playTone(150, 0.3, 'sawtooth', 0.2), 150);
}

function playClick() {
  playTone(800, 0.05, 'square', 0.1);
}

function playWin() {
  const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
  notes.forEach((n, i) => setTimeout(() => playTone(n, 0.2, 'sine', 0.3), i * 150));
}

function playRoundStart() {
  playTone(440, 0.1, 'sine', 0.2);
  setTimeout(() => playTone(554.37, 0.1, 'sine', 0.2), 100);
  setTimeout(() => playTone(659.25, 0.2, 'sine', 0.2), 200);
}

function playTick() {
  playTone(1000, 0.03, 'square', 0.1);
}

// ============ البيانات ============
const nunWords = [
  {word: 'نَمِلَة', emoji: '🐜'},
  {word: 'نَمِر', emoji: '🐯'},
  {word: 'نَجْم', emoji: '⭐'},
  {word: 'نَهْر', emoji: '🌊'},
  {word: 'نافِذَة', emoji: '🪟'},
  {word: 'نَخْلَة', emoji: '🌴'},
  {word: 'نار', emoji: '🔥'},
  {word: 'نَسْر', emoji: '🦅'},
  {word: 'نارِنج', emoji: '🍊'},
  {word: 'نَعْل', emoji: '👡'},
  {word: 'ناي', emoji: '🎵'},
  {word: 'نَبْت', emoji: '🌱'},
  {word: 'نُزْهَة', emoji: '🚶'},
  {word: 'نَادٍ', emoji: '⚽'}
];

const otherWords = [
  {word: 'شَمْس', emoji: '☀️'},
  {word: 'قِطَّة', emoji: '🐱'},
  {word: 'تُفَّاحَة', emoji: '🍎'},
  {word: 'بَحْر', emoji: '🌊'},
  {word: 'كَلْب', emoji: '🐶'},
  {word: 'قَمَر', emoji: '🌙'},
  {word: 'وَرْدَة', emoji: '🌹'},
  {word: 'سَمَكَة', emoji: '🐟'},
  {word: 'فِيل', emoji: '🐘'},
  {word: 'أَرْنَب', emoji: '🐰'},
  {word: 'زَرَافَة', emoji: '🦒'},
  {word: 'فَراشَة', emoji: '🦋'}
];

// ============ حالة اللعبة ============
let players = [];
let currentPlayerIndex = 0;
let currentRound = 0;
let roundData = {};

// ============ دوال مساعدة ============
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr, n) {
  return shuffle(arr).slice(0, n);
}

function showFeedback(emoji) {
  const f = document.createElement('div');
  f.className = 'feedback';
  f.textContent = emoji;
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1000);
}

function launchConfetti() {
  const colors = ['#ffd200', '#43cea2', '#e53935', '#185a9d', '#f7971e'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-20px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 2 + 's';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

function updateScoreboard() {
  const sb = document.getElementById('scoreboard');
  sb.innerHTML = '';
  players.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'player-card' + (i === currentPlayerIndex ? ' active' : '');
    card.innerHTML = `
      <div class="player-name">${p.name}</div>
      <div class="player-score">${p.score}</div>
    `;
    sb.appendChild(card);
  });
}

function updateRoundNav() {
  const nav = document.getElementById('round-nav');
  nav.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const dot = document.createElement('div');
    dot.className = 'round-dot';
    if (i < currentRound) dot.classList.add('done');
    else if (i === currentRound) dot.classList.add('current');
    dot.textContent = i + 1;
    nav.appendChild(dot);
  }
}

function updateTurnIndicator() {
  const ind = document.getElementById('turn-indicator');
  ind.innerHTML = `🎯 دور اللاعب: <span style="color:#ffd200;">${players[currentPlayerIndex].name}</span> 🎯`;
}

function startGame() {
  // تفعيل الصوت بعد تفاعل المستخدم
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  const names = [
    document.getElementById('p1-name').value.trim() || 'اللاعب 1',
    document.getElementById('p2-name').value.trim() || 'اللاعب 2',
    document.getElementById('p3-name').value.trim(),
    document.getElementById('p4-name').value.trim()
  ];
  
  players = names.filter(n => n).map(name => ({name, score: 0}));
  if (players.length < 2) {
    alert('يجب إدخال اسم لاعبين على الأقل!');
    return;
  }
  
  playRoundStart();
  document.getElementById('start-screen').classList.remove('active');
  document.getElementById('game-screen').classList.add('active');
  
  currentRound = 0;
  currentPlayerIndex = 0;
  startRound();
}

function startRound() {
  updateScoreboard();
  updateRoundNav();
  updateTurnIndicator();
  playRoundStart();
  
  const rounds = [
    {title: '🎯 الجولة 1: التقاط النون', desc: 'اضغط "صح" إذا كانت الكلمة تبدأ بحرف نون، و"خطأ" إذا لم تبدأ به (نقطة لكل إجابة صحيحة)'},
    {title: '🏃 الجولة 2: سباق النون', desc: 'اضغط على الكلمات التي تبدأ بحرف نون بسرعة! (نقطتان لكل إجابة صحيحة)'},
    {title: '⭐ الجولة 3: نقطة النجم', desc: 'اختر كل الصور التي تبدأ بحرف نون (نقطتان لكل اختيار صحيح)'},
    {title: '🔗 الجولة 4: المطابقة', desc: 'اربط كل صورة بحرف النون المناسب (3 نقاط لكل تطابق صحيح)'},
    {title: '🦘 الجولة 5: القفز إلى النون', desc: 'اضغط على المربعات التي تحتوي على حرف نون أو صور تبدأ به (نقطتان لكل قفزة صحيحة)'},
    {title: '🏆 الجولة 6: النهائي - سيد حرف النون!', desc: 'اجمع أكبر عدد من الكلمات التي تبدأ بنون في 60 ثانية! (5 نقاط لكل بطاقة)'}
  ];
  
  document.getElementById('round-title').textContent = rounds[currentRound].title;
  document.getElementById('round-desc').textContent = rounds[currentRound].desc;
  
  loadRoundContent();
}

function loadRoundContent() {
  document.getElementById('next-btn').style.display = 'none';
  const content = document.getElementById('round-content');
  content.innerHTML = '';
  
  switch(currentRound) {
    case 0: loadRound1(); break;
    case 1: loadRound2(); break;
    case 2: loadRound3(); break;
    case 3: loadRound4(); break;
    case 4: loadRound5(); break;
    case 5: loadRound6(); break;
  }
}

// ============ الجولة 1: التقاط النون ============
function loadRound1() {
  roundData = {
    cards: shuffle([...pickRandom(nunWords, 5), ...pickRandom(otherWords, 5)]),
    index: 0
  };
  showRound1Card();
}

function showRound1Card() {
  const content = document.getElementById('round-content');
  if (roundData.index >= roundData.cards.length) {
    document.getElementById('next-btn').style.display = 'inline-block';
    content.innerHTML = `
      <div style="text-align:center; padding:30px;">
        <div style="font-size:5em;">🎉</div>
        <div style="font-size:2em; color:#2e7d32; font-weight:bold;">
          أحسنت! ${players[currentPlayerIndex].name} أنهى الجولة
        </div>
      </div>
    `;
    return;
  }
  
  const card = roundData.cards[roundData.index];
  content.innerHTML = `
    <div class="card-display">
      <div style="font-size:1.3em; color:#185a9d; margin-bottom:10px;">
        البطاقة ${roundData.index + 1} من ${roundData.cards.length}
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${(roundData.index / roundData.cards.length) * 100}%"></div>
      </div>
      <div class="big-card">
        <span class="card-emoji">${card.emoji}</span>
        <div class="card-word">${card.word}</div>
      </div>
      <div style="font-size:1.3em; color:#e53935; font-weight:bold; margin:15px 0;">
        هل تبدأ هذه الكلمة بحرف النون؟
      </div>
      <div class="answer-buttons">
        <button class="btn btn-green" onclick="answerRound1(true)">✅ صح</button>
        <button class="btn btn-red" onclick="answerRound1(false)">❌ خطأ</button>
      </div>
    </div>
  `;
}

function answerRound1(isNun) {
  const card = roundData.cards[roundData.index];
  const startsWithNun = nunWords.some(n => n.word === card.word);
  
  if (isNun === startsWithNun) {
    players[currentPlayerIndex].score += 1;
    playCorrect();
    showFeedback('✅');
  } else {
    playWrong();
    showFeedback('❌');
  }
  
  updateScoreboard();
  roundData.index++;
  setTimeout(showRound1Card, 800);
}

// ============ الجولة 2: سباق النون ============
function loadRound2() {
  const items = shuffle([...pickRandom(nunWords, 4), ...pickRandom(otherWords, 4)]);
  roundData = {items, answered: new Set()};
  
  const content = document.getElementById('round-content');
  content.innerHTML = `<div class="race-grid" id="race-grid"></div>`;
  
  const grid = document.getElementById('race-grid');
  items.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'race-item';
    div.innerHTML = `<span class="race-emoji">${item.emoji}</span><div class="race-word">${item.word}</div>`;
    div.onclick = () => answerRound2(i, div);
    grid.appendChild(div);
  });
  
  setTimeout(() => {
    document.getElementById('next-btn').style.display = 'inline-block';
  }, 3000);
}

function answerRound2(index, el) {
  if (roundData.answered.has(index)) return;
  roundData.answered.add(index);
  
  const item = roundData.items[index];
  const startsWithNun = nunWords.some(n => n.word === item.word);
  
  if (startsWithNun) {
    el.classList.add('correct');
    players[currentPlayerIndex].score += 2;
    playCorrect();
    showFeedback('⭐');
  } else {
    el.classList.add('wrong');
    playWrong();
    showFeedback('❌');
    setTimeout(() => el.classList.remove('wrong'), 500);
    roundData.answered.delete(index);
  }
  
  updateScoreboard();
}

// ============ الجولة 3: نقطة النجم ============
function loadRound3() {
  const items = shuffle([...pickRandom(nunWords, 5), ...pickRandom(otherWords, 5)]);
  roundData = {items, selected: new Set(), finished: false};
  
  const content = document.getElementById('round-content');
  content.innerHTML = `
    <div style="text-align:center; margin-bottom:15px;">
      <button class="btn btn-green" onclick="finishRound3()">✨ إنهاء الاختيار</button>
    </div>
    <div class="star-grid" id="star-grid"></div>
  `;
  
  const grid = document.getElementById('star-grid');
  items.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'star-item';
    div.id = 'star-' + i;
    div.innerHTML = `<span class="star-emoji">${item.emoji}</span><div class="star-word">${item.word}</div>`;
    div.onclick = () => toggleRound3(i, div);
    grid.appendChild(div);
  });
}

function toggleRound3(index, el) {
  if (roundData.finished) return;
  playClick();
  if (roundData.selected.has(index)) {
    roundData.selected.delete(index);
    el.classList.remove('selected');
  } else {
    roundData.selected.add(index);
    el.classList.add('selected');
  }
}

function finishRound3() {
  if (roundData.finished) return;
  roundData.finished = true;
  
  let correct = 0;
  roundData.selected.forEach(i => {
    const item = roundData.items[i];
    const startsWithNun = nunWords.some(n => n.word === item.word);
    if (startsWithNun) {
      correct++;
    } else {
      document.getElementById('star-' + i).classList.add('wrong-selected');
    }
  });
  
  // إظهار الكلمات الصحيحة التي لم يتم اختيارها
  roundData.items.forEach((item, i) => {
    const startsWithNun = nunWords.some(n => n.word === item.word);
    if (startsWithNun && !roundData.selected.has(i)) {
      const el = document.getElementById('star-' + i);
      el.style.border = '4px dashed #2e7d32';
      el.style.background = '#e8f5e9';
    }
  });
  
  players[currentPlayerIndex].score += correct * 2;
  updateScoreboard();
  
  if (correct > 0) {
    playCorrect();
    showFeedback('⭐');
  } else {
    playWrong();
  }
  
  document.getElementById('next-btn').style.display = 'inline-block';
}

// ============ الجولة 4: المطابقة ============
function loadRound4() {
  const pairs = pickRandom(nunWords, 4);
  roundData = {
    pairs,
    selectedImage: null,
    selectedLetter: null,
    matched: new Set(),
    letters: shuffle(['ن', 'ب', 'م', 'س'])
  };
  
  const content = document.getElementById('round-content');
  content.innerHTML = `
    <div style="text-align:center; margin-bottom:15px; font-size:1.2em; color:#185a9d;">
      اضغط على صورة ثم اضغط على حرف النون "ن" لمطابقتها
    </div>
    <div class="match-area">
      <div class="match-column" id="match-images"></div>
      <div class="match-column" id="match-letters"></div>
    </div>
  `;
  
  const imgCol = document.getElementById('match-images');
  pairs.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'match-item';
    div.id = 'mimg-' + i;
    div.innerHTML = `<span class="match-emoji">${p.emoji}</span><div>${p.word}</div>`;
    div.onclick = () => selectMatchImage(i, div);
    imgCol.appendChild(div);
  });
  
  const letCol = document.getElementById('match-letters');
  roundData.letters.forEach((l, i) => {
    const div = document.createElement('div');
    div.className = 'match-item';
    div.id = 'mlet-' + i;
    div.innerHTML = `<div style="font-size:3em; color:#e53935; font-weight:bold;">${l}</div>`;
    div.onclick = () => selectMatchLetter(i, div);
    letCol.appendChild(div);
  });
  
  setTimeout(() => {
    document.getElementById('next-btn').style.display = 'inline-block';
  }, 2000);
}

function selectMatchImage(i, el) {
  if (roundData.matched.has(i)) return;
  playClick();
  document.querySelectorAll('#match-images .match-item').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  roundData.selectedImage = i;
  tryMatch();
}

function selectMatchLetter(i, el) {
  playClick();
  document.querySelectorAll('#match-letters .match-item').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  roundData.selectedLetter = {index: i, letter: roundData.letters[i]};
  tryMatch();
}

function tryMatch() {
  if (roundData.selectedImage === null || !roundData.selectedLetter) return;
  
  const imgI = roundData.selectedImage;
  const letI = roundData.selectedLetter.index;
  const letter = roundData.selectedLetter.letter;
  
  const imgEl = document.getElementById('mimg-' + imgI);
  const letEl = document.getElementById('mlet-' + letI);
  
  if (letter === 'ن') {
    imgEl.classList.add('matched');
    letEl.classList.add('matched');
    players[currentPlayerIndex].score += 3;
    playCorrect();
    showFeedback('✨');
    roundData.matched.add(imgI);
    updateScoreboard();
  } else {
    playWrong();
    showFeedback('❌');
    imgEl.style.animation = 'shake 0.5s';
    letEl.style.animation = 'shake 0.5s';
    setTimeout(() => {
      imgEl.style.animation = '';
      letEl.style.animation = '';
    }, 500);
  }
  
  roundData.selectedImage = null;
  roundData.selectedLetter = null;
  document.querySelectorAll('.match-item').forEach(e => e.classList.remove('selected'));
}

// ============ الجولة 5: القفز إلى النون ============
function loadRound5() {
  const tiles = [];
  // 8 مربعات، نصفها صحيح
  const nuns = pickRandom(nunWords, 4).map(n => ({type: 'nun', data: n}));
  const others = pickRandom(otherWords, 4).map(o => ({type: 'other', data: o}));
  const all = shuffle([...nuns, ...others]);
  
  roundData = {tiles: all, finished: false};
  
  const content = document.getElementById('round-content');
  content.innerHTML = `
    <div style="text-align:center; margin-bottom:15px; font-size:1.2em; color:#185a9d;">
      🦘 اقفز فقط على المربعات التي فيها حرف نون أو صور تبدأ به!
    </div>
    <div class="jump-grid" id="jump-grid"></div>
  `;
  
  const grid = document.getElementById('jump-grid');
  all.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'jump-tile';
    div.id = 'jt-' + i;
    if (t.type === 'nun') {
      div.innerHTML = `<div><div style="font-size:1.5em;">${t.data.emoji}</div><div style="font-size:0.7em;">${t.data.word}</div></div>`;
    } else {
      // مربعات خاطئة فيها حروف أخرى
      const wrongLetters = ['ب', 'م', 'س', 'ت', 'ك', 'ل'];
      div.innerHTML = `<div style="font-size:2em;">${wrongLetters[Math.floor(Math.random() * wrongLetters.length)]}</div>`;
    }
    div.onclick = () => jumpTile(i, div, t);
    grid.appendChild(div);
  });
  
  setTimeout(() => {
    document.getElementById('next-btn').style.display = 'inline-block';
  }, 3000);
}

function jumpTile(i, el, tile) {
  if (roundData.finished) return;
  if (el.classList.contains('correct-jump') || el.classList.contains('wrong-jump')) return;
  
  if (tile.type === 'nun') {
    el.classList.add('correct-jump');
    players[currentPlayerIndex].score += 2;
    playCorrect();
    showFeedback('🦘');
  } else {
    el.classList.add('wrong-jump');
    playWrong();
    showFeedback('💥');
    setTimeout(() => el.classList.remove('wrong-jump'), 600);
  }
  updateScoreboard();
}

// ============ الجولة 6: النهائي ============
function loadRound6() {
  const items = shuffle([...pickRandom(nunWords, 8), ...pickRandom(otherWords, 8)]);
  roundData = {
    items,
    timeLeft: 60,
    collected: new Set(),
    timer: null,
    finished: false
  };
  
  const content = document.getElementById('round-content');
  content.innerHTML = `
    <div class="final-area">
      <div class="timer-display" id="timer">⏱️ 60</div>
      <div style="font-size:1.3em; color:#e53935; font-weight:bold; margin-bottom:15px;">
        اجمع أكبر عدد من الكلمات التي تبدأ بنون!
      </div>
      <div class="final-grid" id="final-grid"></div>
    </div>
  `;
  
  const grid = document.getElementById('final-grid');
  items.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'final-item';
    div.id = 'fi-' + i;
    div.innerHTML = `<span class="final-emoji">${item.emoji}</span><div class="final-word">${item.word}</div>`;
    div.onclick = () => collectFinal(i, div, item);
    grid.appendChild(div);
  });
  
  roundData.timer = setInterval(() => {
    roundData.timeLeft--;
    document.getElementById('timer').textContent = '⏱️ ' + roundData.timeLeft;
    if (roundData.timeLeft <= 10) playTick();
    if (roundData.timeLeft <= 0) {
      clearInterval(roundData.timer);
      finishRound6();
    }
  }, 1000);
}

function collectFinal(i, el, item) {
  if (roundData.finished) return;
  if (roundData.collected.has(i)) return;
  
  const startsWithNun = nunWords.some(n => n.word === item.word);
  
  if (startsWithNun) {
    el.classList.add('collected');
    roundData.collected.add(i);
    players[currentPlayerIndex].score += 5;
    playCorrect();
    showFeedback('💎');
    updateScoreboard();
  } else {
    el.classList.add('wrong-collect');
    playWrong();
    showFeedback('❌');
    setTimeout(() => el.classList.remove('wrong-collect'), 500);
  }
}

function finishRound6() {
  roundData.finished = true;
  document.getElementById('next-btn').style.display = 'inline-block';
  launchConfetti();
  playWin();
}

// ============ التنقل بين الأدوار والجولات ============
function nextTurn() {
  playClick();
  currentPlayerIndex++;
  
  if (currentPlayerIndex >= players.length) {
    // كل اللاعبين لعبوا هذه الجولة
    currentPlayerIndex = 0;
    currentRound++;
    
    if (currentRound >= 6) {
      endGame();
      return;
    }
  }
  
  // إذا بدأ لاعب جديد في نفس الجولة، نعيد تحميل الجولة له
  if (currentPlayerIndex === 0 && currentRound > 0) {
    // جولة جديدة
  }
  
  updateTurnIndicator();
  updateScoreboard();
  updateRoundNav();
  
  // إعادة تحميل محتوى الجولة لكل لاعب
  loadRoundContent();
}

function endGame() {
  playWin();
  launchConfetti();
  setTimeout(launchConfetti, 500);
  setTimeout(launchConfetti, 1000);
  
  document.getElementById('game-screen').classList.remove('active');
  document.getElementById('end-screen').classList.add('active');
  
  const sorted = [...players].sort((a, b) => b.score - a.score);
  const winner = sorted[0];
  
  document.getElementById('winner-name').textContent = '🎉 ' + winner.name + ' 🎉';
  
  if (sorted.length > 1 && sorted[0].score === sorted[1].score) {
    document.getElementById('winner-title').textContent = '🤝 تعادل رائع! 🤝';
  } else {
    document.getElementById('winner-title').textContent = '👑 سيد حرف النون 👑';
  }
  
  const scoresDiv = document.getElementById('final-scores');
  scoresDiv.innerHTML = '';
  sorted.forEach((p, i) => {
    const medals = ['🥇', '🥈', '🥉', '🏅'];
    const card = document.createElement('div');
    card.className = 'final-score-card';
    card.innerHTML = `
      <div style="font-size:2em;">${medals[i] || '🏅'}</div>
      <div style="font-size:1.3em; color:#185a9d; font-weight:bold;">${p.name}</div>
      <div style="font-size:2em; color:#e53935; font-weight:bold;">${p.score} نقطة</div>
    `;
    scoresDiv.appendChild(card);
  });
}
</script>
